<!DOCTYPE html>
<html lang="{{LOCALE}}">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta charset="utf-8" />
    <title>Algoritmika</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <iframe id="app-iframe" src="{{URL}}"></iframe>
    <script>
      const vscode = acquireVsCodeApi();
      const iframe = document.getElementById('app-iframe');

      for (const command of [
        'selectAll',
        'copy',
        'paste',
        'cut',
        'undo',
        'redo',
      ]) {
        document.addEventListener(
          command,
          () => {
            iframe.contentWindow.postMessage(
              {
                type: 'vscode-integration/VSCODE/EXEC_COMMAND',
                payload: command,
              },
              '*',
            );
          },
          true,
        );
      }

      window.addEventListener('message', event => {
        try {
          console.log('received message', event.data);
          const message = event.data;
          if (typeof message === 'object' && message.type) {
            if (message.type === 'vscode-integration/PLATFORM/KEY_DOWN') {
              window.dispatchEvent(
                new KeyboardEvent('keydown', message.payload),
              );
              return;
            }
            if (message.type.includes('vscode-integration/PLATFORM')) {
              vscode.postMessage(message);
            }
            if (message.type.includes('vscode-integration/VSCODE')) {
              iframe.contentWindow.postMessage(message, '*');
            }
          }
        } catch (e) {
          console.error('Failed message:', e);
        }
      });
    </script>
  </body>
</html>
